# .github/workflows/build-all.yml
#
# Builds your game for Web, Android, and prepares iOS.
# Web build is deployed to GitHub Pages automatically - test on iPhone Safari!
#
# SETUP INSTRUCTIONS:
# 1. Create a GitHub repo and push your code
# 2. Copy this file to .github/workflows/build-all.yml in your repo
# 3. Go to repo Settings > Pages > Source: "GitHub Actions"
# 4. Push to main branch - builds run automatically
# 5. Your game will be live at: https://YOUR_USERNAME.github.io/YOUR_REPO_NAME/

name: Build All Platforms

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================
  # WEB BUILD - Test on iPhone Safari immediately!
  # ============================================
  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust + WASM target
      run: |
        rustup update stable
        rustup target add wasm32-unknown-unknown
    
    - name: Build WASM
      run: cargo build --release --target wasm32-unknown-unknown
    
    - name: Get package name
      id: pkg
      run: |
        NAME=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].name')
        echo "name=$NAME" >> $GITHUB_OUTPUT
    
    - name: Prepare web files
      run: |
        mkdir -p dist
        cp target/wasm32-unknown-unknown/release/${{ steps.pkg.outputs.name }}.wasm dist/
        
        # Copy assets if they exist
        [ -d "assets" ] && cp -r assets dist/ || true
        
        # Create index.html
        cat > dist/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
            <meta name="apple-mobile-web-app-capable" content="yes">
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
            <meta name="mobile-web-app-capable" content="yes">
            <title>Greenland Survivor</title>
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                html, body { 
                    width: 100%; height: 100%; 
                    overflow: hidden;
                    background: #0f141e;
                    touch-action: none;
                    position: fixed;
                }
                canvas { 
                    width: 100vw; height: 100vh; 
                    display: block;
                }
                body { overscroll-behavior: none; }
            </style>
        </head>
        <body>
            <canvas id="glcanvas" tabindex="1"></canvas>
            <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
            <script>
                document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
                document.addEventListener('gesturestart', e => e.preventDefault());
        EOF
        
        # Add the correct wasm filename
        echo "        load('${{ steps.pkg.outputs.name }}.wasm');" >> dist/index.html
        echo "    </script></body></html>" >> dist/index.html
    
    - name: Upload web artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: dist/
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist

  # ============================================
  # ANDROID BUILD - Get an APK to sideload
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust + Android targets
      run: |
        rustup update stable
        rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK
      run: sdkmanager --install "ndk;25.2.9519653"
    
    - name: Set NDK path
      run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
    
    - name: Install cargo-apk
      run: cargo install cargo-apk
    
    - name: Build APK
      run: cargo apk build --release
      continue-on-error: true  # Don't fail if Android metadata missing
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-apk
        path: target/release/apk/*.apk

  # ============================================
  # iOS BUILD - Requires additional setup
  # ============================================
  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust + iOS targets
      run: |
        rustup update stable
        rustup target add aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
    
    - name: Install cargo-lipo
      run: cargo install cargo-lipo
    
    - name: Build iOS universal library
      run: cargo lipo --release
    
    - name: Get package name
      id: pkg
      run: |
        NAME=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].name')
        echo "name=$NAME" >> $GITHUB_OUTPUT
    
    - name: Package iOS build
      run: |
        mkdir -p ios_package
        cp target/universal/release/lib${{ steps.pkg.outputs.name }}.a ios_package/
        [ -d "assets" ] && cp -r assets ios_package/ || true
        
        # Create info file
        cat > ios_package/README.txt << 'EOF'
        iOS Build Instructions
        ======================
        
        This package contains the compiled library for iOS.
        
        To create an iOS app:
        
        1. You'll need access to a Mac with Xcode (even briefly)
        2. Create a new Xcode project (Game template)
        3. Add this .a library to your project
        4. Link against required frameworks:
           - Metal.framework
           - MetalKit.framework
           - AudioToolbox.framework
           - UIKit.framework
        5. Copy the assets folder into your project
        6. Build and run!
        
        For testing without App Store:
        - Use AltStore (https://altstore.io/) to sideload
        - Or use a cloud Mac service to complete the Xcode build
        
        Library file: lib*.a (universal binary for all iOS devices)
        EOF
    
    - name: Upload iOS package
      uses: actions/upload-artifact@v4
      with:
        name: ios-library
        path: ios_package/